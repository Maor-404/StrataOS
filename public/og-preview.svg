<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="55%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="25%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldGlow" cx="82%" cy="78%" r="45%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#cyanGlow)" />
  <rect width="1280" height="640" fill="url(#emeraldGlow)" />

  <!-- Outer Frame -->
  <rect x="32" y="32" width="1216" height="576" rx="24" fill="#09090b" fill-opacity="0.72" stroke="url(#cardBorder)" stroke-width="1.5" />

  <!-- Top OS Status Bar Mockup -->
  <rect x="33" y="33" width="1214" height="38" rx="23" fill="#12141a" />
  <line x1="33" y1="71" x2="1247" y2="71" stroke="#ffffff" stroke-opacity="0.08" />

  <!-- Top Bar Left: StrataOS Brand + Workspaces -->
  <circle cx="58" cy="52" r="5" fill="#22d3ee" />
  <text x="72" y="57" fill="#f4f4f5" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">StrataOS</text>
  <rect x="150" y="42" width="24" height="20" rx="5" fill="#22d3ee" fill-opacity="0.2" stroke="#22d3ee" stroke-opacity="0.5" />
  <text x="158" y="56" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700">1</text>
  <text x="184" y="56" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="12">2</text>
  <text x="204" y="56" fill="#71717a" font-family="JetBrains Mono, monospace" font-size="12">3</text>

  <!-- Top Bar Right: Kernel Status Pill -->
  <rect x="1036" y="41" width="192" height="22" rx="11" fill="#18181b" stroke="#ffffff" stroke-opacity="0.1" />
  <circle cx="1052" cy="52" r="4.5" fill="#34d399" />
  <text x="1066" y="56" fill="#d4d4d8" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600">Linux 7.3.4 Online • SAB</text>

  <!-- Left Column: Brand Identity, Tagline & Key Badges -->
  <g transform="translate(80, 130)">
    <!-- Layered Strata Logo Mark -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="#12161f" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" />
    <path d="M32 14L50 24L32 34L14 24L32 14Z" stroke="#22d3ee" stroke-width="2.8" stroke-linejoin="round" />
    <path d="M14 33L32 43L50 33" stroke="#34d399" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M14 42L32 52L50 42" stroke="#22d3ee" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Release Tag -->
    <rect x="82" y="14" width="225" height="28" rx="14" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.35" />
    <text x="98" y="32" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">WEBASSEMBLY LINUX 7.x OS</text>

    <!-- Main Title -->
    <text x="0" y="132" fill="#fafafa" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5">StrataOS</text>

    <!-- Required Tagline -->
    <text x="0" y="182" fill="#e4e4e7" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">
      Real Linux 7.x Kernel &amp; WASM Package
    </text>
    <text x="0" y="216" fill="#22d3ee" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="24" font-weight="600">
      Manager in Your Browser
    </text>

    <!-- Architecture Subtitle -->
    <text x="0" y="264" fill="#a1a1aa" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16">
      Dedicated Web Worker kernel • Persistent IndexedDB ext4 disk
    </text>
    <text x="0" y="288" fill="#a1a1aa" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="16">
      120fps hardware-accelerated compositor • Live CLI ↔ GUI store sync
    </text>

    <!-- Key Badges: unkernel, strataget, Zero Backend -->
    <g transform="translate(0, 330)">
      <!-- Badge 1: unkernel -->
      <rect x="0" y="0" width="142" height="42" rx="10" fill="#141820" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" />
      <circle cx="22" cy="21" r="5" fill="#22d3ee" />
      <text x="38" y="26" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">unkernel</text>

      <!-- Badge 2: strataget -->
      <rect x="158" y="0" width="152" height="42" rx="10" fill="#141820" stroke="#34d399" stroke-opacity="0.45" stroke-width="1.5" />
      <circle cx="180" cy="21" r="5" fill="#34d399" />
      <text x="196" y="26" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">strataget</text>

      <!-- Badge 3: Zero Backend -->
      <rect x="326" y="0" width="176" height="42" rx="10" fill="#141820" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.5" />
      <circle cx="348" cy="21" r="5" fill="#fbbf24" />
      <text x="364" y="26" fill="#f4f4f5" font-family="JetBrains Mono, monospace" font-size="15" font-weight="700">Zero Backend</text>
    </g>
  </g>

  <!-- Right Column: Glassmorphic Terminal & Strata Store Window Mockup -->
  <g transform="translate(650, 118)">
    <!-- Background Strata Store Window Card -->
    <rect x="44" y="220" width="510" height="225" rx="14" fill="#111318" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5" />
    <rect x="45" y="221" width="508" height="32" rx="13" fill="#181b22" />
    <text x="66" y="242" fill="#e4e4e7" font-family="Inter, sans-serif" font-size="12" font-weight="600">Strata Store — /opt/strata/apps</text>
    <rect x="448" y="227" width="88" height="20" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4" />
    <text x="462" y="241" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">✓ INSTALLED</text>

    <rect x="64" y="268" width="228" height="72" rx="10" fill="#181b22" stroke="#22d3ee" stroke-opacity="0.3" />
    <text x="80" y="294" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="15" font-weight="700">HexForge v1.4.2</text>
    <text x="80" y="316" fill="#9ca3af" font-family="JetBrains Mono, monospace" font-size="11">wasm-gui • FNV-1a &amp; Entropy</text>

    <rect x="308" y="268" width="228" height="72" rx="10" fill="#181b22" stroke="#34d399" stroke-opacity="0.3" />
    <text x="324" y="294" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="15" font-weight="700">PixelSynth v2.1.0</text>
    <text x="324" y="316" fill="#9ca3af" font-family="JetBrains Mono, monospace" font-size="11">wasm-gui • 60fps Framebuffer</text>

    <rect x="64" y="354" width="472" height="72" rx="10" fill="#181b22" stroke="#ffffff" stroke-opacity="0.08" />
    <text x="80" y="380" fill="#f4f4f5" font-family="Inter, sans-serif" font-size="15" font-weight="700">CalcWASM • MarkView • JSONLab</text>
    <text x="80" y="402" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="11">Synced live with /etc/strata/installed.json on ext4</text>

    <!-- Foreground Strata Terminal Window Card -->
    <rect x="0" y="0" width="520" height="275" rx="14" fill="#09090b" fill-opacity="0.96" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="1.5" />
    <rect x="1" y="1" width="518" height="34" rx="13" fill="#14171f" />
    <circle cx="20" cy="18" r="5" fill="#f87171" />
    <circle cx="36" cy="18" r="5" fill="#fbbf24" />
    <circle cx="52" cy="18" r="5" fill="#34d399" />
    <text x="74" y="22" fill="#d4d4d8" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600">Strata Terminal — /dev/pts/0 (WebGL2)</text>

    <!-- Terminal Output Lines -->
    <g transform="translate(20, 58)" font-family="JetBrains Mono, monospace" font-size="13">
      <text x="0" y="0" fill="#67e8f9" font-weight="700">root@strataos</text>
      <text x="108" y="0" fill="#a1a1aa">:</text>
      <text x="116" y="0" fill="#60a5fa" font-weight="700">~</text>
      <text x="128" y="0" fill="#f4f4f5"># uname -srm</text>
      <text x="0" y="22" fill="#a1a1aa">Linux 7.3.4-unkernel aarch64 (arch/wasm SMP + kwemu JIT)</text>

      <text x="0" y="54" fill="#67e8f9" font-weight="700">root@strataos</text>
      <text x="108" y="54" fill="#a1a1aa">:</text>
      <text x="116" y="54" fill="#60a5fa" font-weight="700">~</text>
      <text x="128" y="54" fill="#f4f4f5"># strataget install hexforge calcwasm</text>

      <text x="0" y="78" fill="#22d3ee">  [████████████████████████] 100%</text>
      <text x="268" y="78" fill="#d4d4d8">Flushing ext4 to IndexedDB</text>
      <text x="0" y="102" fill="#34d399" font-weight="700">✓ Installed HexForge v1.4.2</text>
      <text x="234" y="102" fill="#71717a">→ /opt/strata/apps/hexforge</text>
      <text x="0" y="124" fill="#34d399" font-weight="700">✓ Installed CalcWASM v1.2.0</text>
      <text x="234" y="124" fill="#71717a">→ /usr/local/bin/calcwasm</text>

      <text x="0" y="156" fill="#67e8f9" font-weight="700">root@strataos</text>
      <text x="108" y="156" fill="#a1a1aa">:</text>
      <text x="116" y="156" fill="#60a5fa" font-weight="700">~</text>
      <text x="128" y="156" fill="#f4f4f5"># calcwasm "2^16 + sqrt(144)"</text>
      <text x="0" y="180" fill="#34d399" font-weight="700">  2^16 + sqrt(144) = 65548</text>
      <text x="210" y="180" fill="#71717a">[0x1000C | WASI Preview 1]</text>
    </g>
  </g>
</svg>
