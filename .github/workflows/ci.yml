name: CI Build, Header Guard & Cloudflare 25 MiB Check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Strict Check
        run: npx tsc -b

      - name: Build Production Bundle
        run: npm run build

      - name: Verify Cloudflare Pages Artifacts, COOP/COEP Headers & 25 MiB File Limit
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -f dist/_headers
          test -f dist/_redirects
          grep -Fq "Cross-Origin-Opener-Policy: same-origin" dist/_headers
          grep -Fq "Cross-Origin-Embedder-Policy: require-corp" dist/_headers
          grep -Fq "X-Content-Type-Options: nosniff" dist/_headers
          grep -Fq "/* /index.html 200" dist/_redirects

          MAX_BYTES=$((25 * 1024 * 1024))
          OVERSIZED=0
          while IFS= read -r -d '' file; do
            size=$(stat -c%s "$file")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              echo "::error::Cloudflare Pages limit exceeded (>25 MiB): $file ($size bytes)"
              OVERSIZED=1
            fi
          done < <(find dist -type f -print0)

          if [ "$OVERSIZED" -ne 0 ]; then
            exit 1
          fi
          echo "Verified dist/index.html, dist/_headers (COOP/COEP), dist/_redirects, and all dist/ files <= 25 MiB."
