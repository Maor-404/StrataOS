name: Release StrataOS Static Distribution

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Package Static Distribution Archive & SHA-256 Checksums
        run: |
          ARCHIVE_NAME="strata-os-${GITHUB_REF_NAME}-static.zip"
          cd dist
          zip -r "../${ARCHIVE_NAME}" .
          cd ..
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            strata-os-${{ github.ref_name }}-static.zip
            strata-os-${{ github.ref_name }}-static.zip.sha256
          generate_release_notes: true
